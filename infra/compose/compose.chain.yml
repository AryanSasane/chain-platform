name: chain-dev

networks:
  validator-net:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  validator1-data:
  validator2-data:
  validator3-data:
  validator4-data:
  prometheus-data:
  grafana-data:

services:
  validator1:
    image: hyperledger/besu:${BESU_VERSION}
    restart: unless-stopped
    # Shared host: cap each node so a leak cannot starve other workloads
    mem_limit: 2g
    environment:
      BESU_OPTS: -Xmx1g
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/keys/key
      - --data-path=/var/lib/besu
      - --data-storage-format=BONSAI
      - --min-gas-price=0
      - --p2p-host=172.30.0.11
      - --static-nodes-file=/config/static-nodes.json
      - --metrics-enabled
      - --metrics-host=0.0.0.0
      - --host-allowlist=validator1,localhost,127.0.0.1
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,QBFT
    ports:
      - "127.0.0.1:8545:8545"
      - "127.0.0.1:9545:9545"
    volumes:
      - validator1-data:/var/lib/besu
      - ../../secrets/dev/genesis.json:/config/genesis.json:ro
      - ../../secrets/dev/static-nodes.json:/config/static-nodes.json:ro
      - ../../secrets/dev/validator1/key:/keys/key:ro
    networks:
      validator-net:
        ipv4_address: 172.30.0.11

  validator2:
    image: hyperledger/besu:${BESU_VERSION}
    restart: unless-stopped
    # Shared host: cap each node so a leak cannot starve other workloads
    mem_limit: 2g
    environment:
      BESU_OPTS: -Xmx1g
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/keys/key
      - --data-path=/var/lib/besu
      - --data-storage-format=BONSAI
      - --min-gas-price=0
      - --p2p-host=172.30.0.12
      - --static-nodes-file=/config/static-nodes.json
      - --metrics-enabled
      - --metrics-host=0.0.0.0
      - --host-allowlist=validator2,localhost,127.0.0.1
    ports:
      - "127.0.0.1:9546:9545"
    volumes:
      - validator2-data:/var/lib/besu
      - ../../secrets/dev/genesis.json:/config/genesis.json:ro
      - ../../secrets/dev/static-nodes.json:/config/static-nodes.json:ro
      - ../../secrets/dev/validator2/key:/keys/key:ro
    networks:
      validator-net:
        ipv4_address: 172.30.0.12

  validator3:
    image: hyperledger/besu:${BESU_VERSION}
    restart: unless-stopped
    # Shared host: cap each node so a leak cannot starve other workloads
    mem_limit: 2g
    environment:
      BESU_OPTS: -Xmx1g
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/keys/key
      - --data-path=/var/lib/besu
      - --data-storage-format=BONSAI
      - --min-gas-price=0
      - --p2p-host=172.30.0.13
      - --static-nodes-file=/config/static-nodes.json
      - --metrics-enabled
      - --metrics-host=0.0.0.0
      - --host-allowlist=validator3,localhost,127.0.0.1
    ports:
      - "127.0.0.1:9547:9545"
    volumes:
      - validator3-data:/var/lib/besu
      - ../../secrets/dev/genesis.json:/config/genesis.json:ro
      - ../../secrets/dev/static-nodes.json:/config/static-nodes.json:ro
      - ../../secrets/dev/validator3/key:/keys/key:ro
    networks:
      validator-net:
        ipv4_address: 172.30.0.13

  validator4:
    image: hyperledger/besu:${BESU_VERSION}
    restart: unless-stopped
    # Shared host: cap each node so a leak cannot starve other workloads
    mem_limit: 2g
    environment:
      BESU_OPTS: -Xmx1g
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/keys/key
      - --data-path=/var/lib/besu
      - --data-storage-format=BONSAI
      - --min-gas-price=0
      - --p2p-host=172.30.0.14
      - --static-nodes-file=/config/static-nodes.json
      - --metrics-enabled
      - --metrics-host=0.0.0.0
      - --host-allowlist=validator4,localhost,127.0.0.1
    ports:
      - "127.0.0.1:9548:9545"
    volumes:
      - validator4-data:/var/lib/besu
      - ../../secrets/dev/genesis.json:/config/genesis.json:ro
      - ../../secrets/dev/static-nodes.json:/config/static-nodes.json:ro
      - ../../secrets/dev/validator4/key:/keys/key:ro
    networks:
      validator-net:
        ipv4_address: 172.30.0.14

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      validator-net:
        ipv4_address: 172.30.0.20

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    restart: unless-stopped
    mem_limit: 768m
    env_file: ../../secrets/dev/grafana.env
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ../monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../monitoring/grafana/chain.json:/etc/grafana/dashboards/chain.json:ro
    networks:
      validator-net:
        ipv4_address: 172.30.0.21
