# Single entry point for JSON-RPC: spreads load over rpc1/rpc2 and skips a node that is down
upstream besu_http {
    server rpc1:8545 max_fails=2 fail_timeout=10s;
    server rpc2:8545 max_fails=2 fail_timeout=10s;
}

upstream besu_ws {
    server rpc1:8546 max_fails=2 fail_timeout=10s;
    server rpc2:8546 max_fails=2 fail_timeout=10s;
}

server {
    listen 8545;
    location / {
        proxy_pass http://besu_http;
        # Besu only answers allowlisted Host headers
        proxy_set_header Host localhost;
        # A stopped node's IP drops packets; without a short timeout nginx waits 60s before trying the other node
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}

server {
    listen 8546;
    location / {
        proxy_pass http://besu_ws;
        proxy_connect_timeout 2s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host localhost;
        proxy_read_timeout 1h;
    }
}
